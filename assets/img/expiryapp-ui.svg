<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ExpiryApp representative Android interface</title>
  <desc id="desc">Portfolio mockup showing expiry date scanning, saved products, countdown calculations, and reminder notifications.</desc>
  <rect width="1200" height="900" fill="#ecece7"/>
  <text x="72" y="84" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">ExpiryApp</text>
  <text x="72" y="116" font-family="Arial, sans-serif" font-size="14" fill="#667085">REPRESENTATIVE UI · ANDROID EXPIRY TRACKER</text>

  <g transform="translate(86 168)">
    <rect x="0" y="0" width="300" height="610" rx="34" fill="#111827"/>
    <rect x="11" y="11" width="278" height="588" rx="26" fill="#fbfbf8"/>
    <rect x="103" y="24" width="94" height="7" rx="4" fill="#d0d5dd"/>
    <text x="34" y="83" font-family="Arial, sans-serif" font-size="13" fill="#667085">GOOD MORNING</text>
    <text x="34" y="118" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#101828">Track expiry.</text>
    <rect x="34" y="154" width="232" height="126" rx="18" fill="#1f5eff"/>
    <text x="58" y="190" font-family="Arial, sans-serif" font-size="13" fill="#dbe7ff">QUICK ACTION</text>
    <text x="58" y="225" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">Scan expiry date</text>
    <rect x="58" y="244" width="108" height="24" rx="12" fill="#ffffff" opacity=".18"/>
    <text x="72" y="261" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="white">OPEN CAMERA</text>
    <text x="34" y="326" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101828">Expiring soon</text>
    <g font-family="Arial, sans-serif">
      <rect x="34" y="350" width="232" height="76" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
      <circle cx="64" cy="388" r="16" fill="#fff3e0"/>
      <text x="90" y="380" font-size="13" font-weight="700" fill="#101828">Fresh Milk</text>
      <text x="90" y="401" font-size="11" fill="#667085">Expires Sep 13, 2026</text>
      <text x="213" y="391" font-size="12" font-weight="700" fill="#d97706">4 days</text>
      <rect x="34" y="438" width="232" height="76" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
      <circle cx="64" cy="476" r="16" fill="#fee2e2"/>
      <text x="90" y="468" font-size="13" font-weight="700" fill="#101828">Yogurt</text>
      <text x="90" y="489" font-size="11" fill="#667085">Expires Sep 10, 2026</text>
      <text x="218" y="479" font-size="12" font-weight="700" fill="#dc2626">1 day</text>
    </g>
  </g>

  <g transform="translate(454 132)">
    <rect x="0" y="0" width="300" height="610" rx="34" fill="#111827"/>
    <rect x="11" y="11" width="278" height="588" rx="26" fill="#fbfbf8"/>
    <rect x="103" y="24" width="94" height="7" rx="4" fill="#d0d5dd"/>
    <text x="34" y="84" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#101828">SCAN EXPIRY DATE</text>
    <rect x="34" y="112" width="232" height="278" rx="18" fill="#202938"/>
    <rect x="62" y="156" width="176" height="188" rx="10" fill="#2f3a4d"/>
    <path d="M78 184v-18h18M222 184v-18h-18M78 316v18h18M222 316v18h-18" stroke="#6f9cff" stroke-width="5" fill="none"/>
    <rect x="84" y="232" width="132" height="46" rx="7" fill="#fbfbf8"/>
    <text x="103" y="260" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">09 / 28 / 26</text>
    <rect x="34" y="414" width="232" height="70" rx="14" fill="#ffffff" stroke="#e4e7ec"/>
    <text x="52" y="441" font-family="Arial, sans-serif" font-size="11" fill="#667085">DETECTED DATE</text>
    <text x="52" y="466" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#101828">September 28, 2026</text>
    <rect x="34" y="505" width="232" height="52" rx="13" fill="#1f5eff"/>
    <text x="100" y="538" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">SAVE PRODUCT</text>
  </g>

  <g transform="translate(824 206)">
    <rect x="0" y="0" width="290" height="470" rx="28" fill="#ffffff" stroke="#d0d5dd"/>
    <text x="28" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#101828">SMART REMINDERS</text>
    <rect x="28" y="82" width="234" height="112" rx="16" fill="#f2f5ff"/>
    <circle cx="61" cy="118" r="18" fill="#1f5eff"/>
    <path d="M61 106v12l8 5" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="91" y="112" font-family="Arial, sans-serif" font-size="12" fill="#667085">Expiry reminder</text>
    <text x="91" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#101828">Milk expires in 4 days</text>
    <text x="91" y="158" font-family="Arial, sans-serif" font-size="11" fill="#667085">Tap to view saved item</text>

    <text x="28" y="244" font-family="Arial, sans-serif" font-size="12" fill="#667085">DATE CALCULATION</text>
    <text x="28" y="286" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#101828">19 days</text>
    <text x="28" y="315" font-family="Arial, sans-serif" font-size="13" fill="#667085">until next saved expiry</text>
    <line x1="28" y1="350" x2="262" y2="350" stroke="#e4e7ec"/>
    <text x="28" y="388" font-family="Arial, sans-serif" font-size="12" fill="#667085">FLOW</text>
    <text x="28" y="419" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#101828">Scan → Store → Calculate → Notify</text>
  </g>

  <text x="72" y="850" font-family="Arial, sans-serif" font-size="13" fill="#777772">Portfolio visualization based on the project’s implemented feature direction; not an exported production screenshot.</text>
</svg>